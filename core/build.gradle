[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

sourceSets {
  main {
    resources {
      // Classpath must expose "/assets/data/..." (getResourceAsStream paths in loaders).
      srcDirs = [rootProject.projectDir]
      include 'assets/**'
    }
  }
}

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.github.raeleus.TenPatch:tenpatch:$tenPatchVersion"
  api "com.github.ahgharaghani:pvz-skin:$pvzSkinVersion"
  api "com.github.pizpizi:libPVZ:$libPvzVersion"

  api "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
  api "org.jline:jline:$jlineVersion"

  if (enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  testImplementation platform("org.junit:junit-bom:$junitVersion")
  testImplementation 'org.junit.jupiter:junit-jupiter'
  // Gradle 9's test executor needs the launcher on the runtime classpath.
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
  useJUnitPlatform()
  testLogging {
    events "passed", "skipped", "failed", "standardOut", "standardError"
  }
}

def networkConfigDir = layout.buildDirectory.dir('generated/resources/network')

tasks.register('generateNetworkConfig') {
  def clientHost = (rootProject.findProperty('pvz.client.host')
      ?: rootProject.findProperty('pvz.server.host')
      ?: '127.0.0.1').toString()
  def clientPort = (rootProject.findProperty('pvz.client.port')
      ?: rootProject.findProperty('pvz.server.port')
      ?: '8080').toString()
  inputs.property('host', clientHost)
  inputs.property('port', clientPort)
  def outputFile = networkConfigDir.map { it.file('pvz-network.properties') }
  outputs.file(outputFile)
  doLast {
    def file = outputFile.get().asFile
    file.parentFile.mkdirs()
    file.setText(
        '# Generated from gradle.properties — do not edit.\n' +
            "host=${clientHost}\n" +
            "port=${clientPort}\n",
        'UTF-8')
  }
}

tasks.named('processResources') {
  dependsOn 'generateNetworkConfig'
  from(networkConfigDir) {
    include 'pvz-network.properties'
  }
}

// Phase-1 TUI (no LWJGL natives).
tasks.register('runTui', JavaExec) {
  group = 'application'
  description = 'Run the terminal UI (JLine)'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'Main'
  standardInput = System.in
  workingDir = rootProject.projectDir
  jvmArgs = ['--enable-native-access=ALL-UNNAMED']
  systemProperty 'pvz.client.host', rootProject.findProperty('pvz.client.host') ?: rootProject.findProperty('pvz.server.host') ?: '127.0.0.1'
  systemProperty 'pvz.client.port', rootProject.findProperty('pvz.client.port') ?: rootProject.findProperty('pvz.server.port') ?: '8080'
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
