[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

sourceSets {
  main {
    resources {
      // Classpath must expose "/assets/data/..." (getResourceAsStream paths in loaders).
      srcDirs = [rootProject.projectDir]
      include 'assets/**'
    }
  }
}

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.github.raeleus.TenPatch:tenpatch:$tenPatchVersion"
  api "com.github.pizpizi:pvz-skin:$pvzSkinVersion"
  api "com.github.pizpizi:libPVZ:$libPvzVersion"

  api "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
  api "org.jline:jline:$jlineVersion"

  if (enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  testImplementation platform("org.junit:junit-bom:$junitVersion")
  testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test') {
  useJUnitPlatform()
}

// Phase-1 TUI (no LWJGL natives).
tasks.register('runTui', JavaExec) {
  group = 'application'
  description = 'Run the terminal UI (JLine)'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'Main'
  standardInput = System.in
  workingDir = rootProject.projectDir
  jvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
