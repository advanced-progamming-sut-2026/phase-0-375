buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {


  }
}

plugins {
  id 'com.gradleup.shadow' version '9.6.1' apply false
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  apply plugin: 'checkstyle'
  apply plugin: 'pmd'
  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(25)
    }
  }

  checkstyle {
    toolVersion = '13.7.0'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    ignoreFailures = true
    maxWarnings = Integer.MAX_VALUE
    maxErrors = Integer.MAX_VALUE
  }

  pmd {
    toolVersion = '7.20.0'
    consoleOutput = true
    ignoreFailures = true
    ruleSetFiles = files(rootProject.file('config/pmd/pmd.xml'))
    ruleSets = []
  }

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // projectFolder/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // projectFolder/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")
    // delete that file in case we've already created it
    assetsFile.delete()

    // iterate through all files inside that folder
    // convert it to a relative path
    // and append it to the file assets.txt (excluding external remote assets)
    fileTree(assetsFolder) {
      exclude 'remote/**'
    }.collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'PlantsVsZombies2'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }
}

eclipse.project.name = 'PlantsVsZombies2' + '-parent'

tasks.register('shadowJar') {
  group = 'build'
  description = 'Assembles fat JARs for all subprojects using Shadow.'
  dependsOn subprojects.collect { "${it.path}:shadowJar" }
}
