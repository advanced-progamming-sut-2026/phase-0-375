org.gradle.jvmargs=-Xms512M -Xmx1G -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
org.gradle.configureondemand=false
org.gradle.logging.level=quiet
org.gradle.console=colored
# Liftoff/construo + generateAssetList are happier without configuration cache.
org.gradle.configuration-cache=false

tenPatchVersion=5.2.3
lwjgl3Version=3.4.1
graalHelperVersion=2.0.1
enableGraalNative=false
gdxVersion=1.14.2
projectVersion=1.0.0

pvzSkinVersion=v0.1.1
libPvzVersion=v0.1.6
jacksonVersion=2.15.2
jlineVersion=3.26.3
junitVersion=5.10.2

# Extracted PvZ2 Base Assets root for libPVZ (TextureBank / PamPlayer).
pvz.assets=C://Users/ahgha/Desktop/pvz-assets
pvz.resolution=768

# Dedicated multiplayer server bind address (ServerLauncher / :server:run).
# Use 0.0.0.0 to accept connections from other machines on the LAN.
pvz.server.host=127.0.0.1
pvz.server.port=8080

# Address game clients use to connect. Gradle run tasks pass these as
# -Dpvz.client.host / -Dpvz.client.port, and :core bakes them into
# pvz-network.properties so IDE launches pick up the same values.
pvz.client.host=127.0.0.1
pvz.client.port=8080
